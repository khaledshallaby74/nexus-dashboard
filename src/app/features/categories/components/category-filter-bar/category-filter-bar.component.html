<div class="filter-section-wrapper w-100" role="search" 
  [attr.aria-label]="'FILTER_BAR.ARIA.NAV_FILTERS' | translate:{ moduleName: (moduleTranslationKey() | translate) }">
  <!-- Header area: Title + Add button -->
  <div class="d-flex justify-content-between align-items-center gap-3 w-100 mb-3">
    <div class="title-area">
      <h1 class="page-title fs-24 fw-bold mb-1">
        {{ 'FILTER_BAR.GENERIC_TITLE' | translate:{ moduleName: (moduleTranslationKey() | translate) } }}
      </h1>
      <p class="page-subtitle fs-14 text-muted mb-0">
        {{ 'FILTER_BAR.GENERIC_SUBTITLE' | translate:{ moduleName: (moduleTranslationKey() | translate) } }}
      </p>
    </div>
    <!-- Add new entity button -->
    <button 
      type="button" 
      class="btn-add bg-green-500 cursor-pointer text-white border-0" 
      [attr.aria-label]="'FILTER_BAR.ARIA.CREATE_ENTITY' | translate:{ entityName: (entitySingularTranslationKey() | translate) }"
      (click)="addNewCategory.emit()">
      {{ 'FILTER_BAR.BTN_NEW_PREFIX' | translate:{ entityName: (entitySingularTranslationKey() | translate) } }}
      <span class="icon" aria-hidden="true">+</span> 
    </button>
  </div>
  <!-- Filter bar card: Search, View switcher -->
  <div class="filter-bar-card w-100">
    <div class="row align-items-end w-100 m-0">
      <!-- Search input column -->
      <div class="col-12 col-lg-6 px-2">
        <div class="d-flex flex-column gap-1">
          <label class="form-label mb-1" for="category-search-field">
            {{ 'FILTER_BAR.LABELS.SEARCH' | translate }}
          </label>
          <app-search-input 
            id="category-search-field"
            [placeholder]="'COMMON.SEARCH_PLACEHOLDER'"
            [ariaLabel]="'FILTER_BAR.LABELS.SEARCH' | translate"
            (searchChange)="onSearch($event)">
          </app-search-input>
        </div>
      </div>
      <!-- View switcher (Table / Cards toggle) -->
      <div class="col-12 col-lg-6 p-0 mt-3 mt-lg-0">
        <div class="row g-2 align-items-end justify-content-end m-0 w-100">
          <div class="col-12 d-flex justify-content-end px-2">
            <div role="group" [attr.aria-label]="'Layout view switch options'">
              <app-view-switcher 
                [currentMode]="currentViewMode()" 
                (modeChange)="setViewMode($event)">
              </app-view-switcher>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
